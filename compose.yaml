# Local development services. Start with: docker compose up -d
name: pagina-web

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-store}
      MYSQL_USER: ${DB_USERNAME:-store}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      # Bound to localhost only; 3307 avoids clashing with XAMPP's MariaDB on 3306
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP check: the temporary server used during first-time init only listens on the socket
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
